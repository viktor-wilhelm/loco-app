<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="img/3_enemies_chicken/chicken_normal/1_walk/1_w.png" />
    <link rel="stylesheet" href="style.css" />
    <title>EL POLLO LOCO</title>
    <script src="js/assets.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/boss-chicken.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/bottle-pickup.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/world.class.js"></script>

    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
  </head>

  <body onload="init()">
    <header>
      <h1>EL POLLO LOCO</h1>
    </header> 

    <main id="game-container" class="game">
      <canvas id="canvas" width="720" height="480"></canvas>

      <div id="start-screen" class="game__start-screen">
        <div class="game__ui">
          <input type="range" id="volume-slider" class="game__volume-slider" min="0" max="1" step="0.01" value="1" />
          <div class="game__actions">
            <button class="game__btn game__btn--menu" onclick="startGame()">MENU</button>
            <button class="game__btn game__btn--fullscreen" onclick="toggleFullscreen()" title="Vollbild">
              <img src="img/10_menu/icons-vollbild-20.png" alt="Vollbild" />
            </button>
          </div>
        </div>
      </div>

    </main>

    <footer>
      <p>&copy; 2026 EL POLLO LOCO. All rights reserved.</p>
    </footer>
  </body>
</html>
